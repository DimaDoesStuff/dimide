name: Build DimIDE macOS DMG

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  # macOS Build (Intel x64 - for 2019 MacBook Air) with DMG
  build-macos-dmg:
    runs-on: macos-13  # Intel runner
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm install
          npx playwright install-deps 2>/dev/null || true

      - name: Build DimIDE (macOS x64 Intel)
        run: |
          export npm_config_arch=x64
          npm run gulp vscode-darwin-x64-ci
        timeout-minutes: 90

      - name: Create DMG
        run: npm run gulp vscode-darwin-x64-build-dmg
        continue-on-error: true
        timeout-minutes: 30

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: DimIDE-macOS-Intel-x64-DMG
          path: |
            .build/darwin/x64/*.dmg
            ../VSCode-darwin-x64/
          if-no-files-found: warn
          retention-days: 7
